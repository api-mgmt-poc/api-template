openapi: 3.0.3
info:
  title: Demo API
  version: 1.0.0
  description: Template API definition. Replace it with your own API. Dummy data only.
  contact:
    name: API owner team
    email: api-owner@example.invalid
servers:
  - url: https://api.example.invalid/demo/v1
    description: Gateway endpoint (placeholder)
security:
  - oauth2:
      - demo.read
tags:
  - name: items
    description: Demo items
paths:
  /items/{id}:
    get:
      operationId: getItem
      summary: Get one item
      description: Returns one demo item by its identifier.
      tags:
        - items
      parameters:
        - name: id
          in: path
          required: true
          description: Item identifier
          schema:
            type: string
            pattern: "^[a-z0-9-]{1,40}$"
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials via the corporate identity provider
      flows:
        clientCredentials:
          tokenUrl: https://login.example.invalid/oauth2/token
          scopes:
            demo.read: Read demo items
  schemas:
    Item:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: item-1
        name:
          type: string
          example: Demo item
    Problem:
      type: object
      description: Error details according to RFC 9457
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Token lacks the required scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Item does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit or quota exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
